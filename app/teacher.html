<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>先生用・候補日入力｜平沼マーチングバンド</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .teacher-card { border-left:4px solid var(--navy); padding:14px 16px; margin:10px 0; }
    .teacher-card h2 { margin-bottom:2px; }
    .teacher-card p:last-child { margin-bottom:0; }
    .session-meta { color:var(--muted); margin:0; font-size:.9rem; }
    .teacher-session { padding:12px 16px; margin:10px 0; }
    .teacher-session h2 { margin:0 0 2px; font-size:1.1rem; }
    .slot-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .slot { margin-top:0; }
    .teacher-slot { display:grid; grid-template-columns:3em minmax(0,1fr); gap:8px; align-items:center; padding:7px 8px; border:1px solid var(--line); border-radius:9px; }
    .teacher-slot h3 { margin:0; font-size:.95rem; }
    .teacher-slot .pills { flex-wrap:nowrap; gap:4px; margin:0; }
    .teacher-slot .pills button { flex:1; min-height:36px; padding:4px 6px; font-size:.86rem; }
    .not-needed { background:#f1f3f7; color:var(--muted); border-radius:10px; padding:12px; }
    .not-needed strong { display:block; color:var(--ink); }
    .month-pills button { flex:1 1 100px; }
    .save-bar { position:sticky; bottom:0; background:rgba(246,247,251,.95); padding:12px 0 2px; }
    .save-bar button { width:100%; }
    @media(max-width:520px) {
      .teacher-session { padding:10px 12px; }
      .teacher-session h2 { font-size:1.02rem; }
      .slot-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
      .teacher-slot { grid-template-columns:3em minmax(0,1fr); }
      .teacher-slot .pills { gap:2px; }
      .teacher-slot .pills button { min-height:34px; padding:3px 2px; font-size:.7rem; }
    }
  </style>
  <script src="api.js" defer></script>
  <script src="teacher.js" defer></script>
</head>
<body>
  <header><div class="shell"><p class="eyebrow">平沼マーチングバンド · 先生用</p><h1>候補日の可否入力</h1></div></header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite">読み込み中です…</p>
    <section id="connection" class="card" hidden>
      <h2>アプリの接続設定</h2>
      <p>管理者から案内された先生用URLで開いてください。初回のみGAS Web AppのURLを設定します。</p>
      <label>GAS Web App URL<input id="api-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
      <button id="connect" type="button" class="primary">接続する</button>
    </section>
    <fieldset id="workspace" hidden>
      <legend class="sr-only">先生用候補日入力</legend>
      <section class="card teacher-card">
        <p class="muted">入力する先生</p>
        <h2 id="teacher-name"></h2>
        <p class="muted">○（参加可）・×（不可）を選んでください。同じボタンをもう一度押すと未入力に戻ります。送信後も管理者が予定を確定するまでは修正できます。</p>
      </section>
      <section class="card teacher-month">
        <h2>対象月</h2>
        <div id="months" class="pills month-pills" role="group" aria-label="対象月"></div>
      </section>
      <section id="sessions" aria-live="polite"></section>
      <div class="save-bar"><p id="save-state" class="muted">変更はありません。</p><button id="save" type="button" class="primary">入力内容を送信する</button></div>
    </fieldset>
  </main>
</body>
</html>
