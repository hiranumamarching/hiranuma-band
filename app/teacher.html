<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>先生用・候補日入力｜平沼マーチングバンド</title>
  <link rel="stylesheet" href="common.css">
  <style>
    header { padding:9px 0; }
    header h1 { margin:0; font-size:1.2rem; }
    main.shell { padding:5px 10px 72px; }
    #message { margin:3px 2px; font-size:.75rem; line-height:1.25; }
    .teacher-card { padding:8px 10px; margin:6px 0; }
    .teacher-identity { display:flex; align-items:baseline; gap:8px; }
    .teacher-identity p, .teacher-identity h2 { margin:0; }
    .teacher-identity p { font-size:.75rem; }
    .teacher-identity h2 { font-size:1rem; }
    .teacher-card > p { margin:3px 0 0; font-size:.72rem; line-height:1.35; }
    .teacher-month { display:flex; align-items:center; gap:8px; padding:7px 9px; margin:6px 0; }
    .teacher-month h2 { flex:0 0 auto; margin:0; font-size:.9rem; }
    .month-pills { display:flex; flex:1; flex-wrap:nowrap; gap:4px; min-width:0; overflow-x:auto; margin:0; }
    .month-pills button { flex:1 0 auto; min-height:34px; padding:4px 8px; font-size:.78rem; }
    .teacher-grid-card { padding:3px 6px; margin:6px 0 3px; }
    .teacher-grid { width:100%; table-layout:fixed; font-size:.8rem; }
    .teacher-grid th, .teacher-grid td { padding:4px 3px; vertical-align:middle; }
    .teacher-grid thead th { background:#f1f3f8; color:var(--muted); text-align:center; font-size:.75rem; }
    .teacher-grid thead th:first-child { width:27%; text-align:left; }
    .teacher-day-row { height:52px; }
    .teacher-day-date { font-size:.75rem; white-space:nowrap; }
    .teacher-day-date span, .teacher-day-date small { display:block; overflow:hidden; text-overflow:ellipsis; }
    .teacher-day-date small { color:var(--muted); font-size:.62rem; font-weight:400; }
    .teacher-slot-cell { text-align:center; }
    .answer-buttons { display:flex; justify-content:center; gap:4px; }
    .answer-choice { width:40px; min-height:42px; padding:2px; font-size:1rem; font-weight:700; }
    .cell-state { display:block; color:var(--muted); text-align:center; font-size:.72rem; white-space:nowrap; }
    .merged-state { background:#f7f8fb; }
    .save-bar { position:fixed; z-index:5; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:6px 12px max(6px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(246,247,251,.97); }
    .save-bar #save-state { flex:1; margin:0; font-size:.75rem; }
    .save-bar button { flex:0 0 auto; min-height:40px; padding:5px 14px; }
  </style>
  <script src="api.js" defer></script>
  <script src="teacher.js" defer></script>
</head>
<body>
  <header><div class="shell"><p class="eyebrow">平沼マーチングバンド · 先生用</p><h1>候補日の可否入力</h1></div></header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite">読み込み中です…</p>
    <section id="connection" class="card" hidden>
      <h2>アプリの接続設定</h2>
      <p>管理者から案内された先生用URLで開いてください。初回のみGAS Web AppのURLを設定します。</p>
      <label>GAS Web App URL<input id="api-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
      <button id="connect" type="button" class="primary">接続する</button>
    </section>
    <fieldset id="workspace" hidden>
      <legend class="sr-only">先生用候補日入力</legend>
      <section class="card teacher-card">
        <div class="teacher-identity"><p class="muted">入力する先生</p><h2 id="teacher-name"></h2></div>
        <p class="muted">○／×を選択。選択中をもう一度押すと未入力に戻ります。</p>
      </section>
      <section class="card teacher-month">
        <h2>対象月</h2>
        <div id="months" class="pills month-pills" role="group" aria-label="対象月"></div>
      </section>
      <section id="sessions" aria-live="polite"></section>
      <div class="save-bar"><p id="save-state" class="muted">変更はありません。</p><button id="save" type="button" class="primary">送信</button></div>
    </fieldset>
  </main>
</body>
</html>
