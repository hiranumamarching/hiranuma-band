<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; media-src blob:; base-uri 'none'; form-action 'none'">
  <title>架空データ試用版｜運営管理｜平沼マーチングバンド</title>
  <link rel="stylesheet" href="common.css?v=20261101-video1">
  <script src="preview-api.js?v=trial1" defer></script>
  <script src="shared.js?v=20261031-cards1" defer></script>
  <script src="practice-plan.js?v=20261029-shared1" defer></script>
  <script src="layout-mobile.js?v=20261101-touch1" defer></script>
  <script src="practice-library.js?v=20261101-video1" defer></script>
  <script src="admin.js?v=20261101-video1" defer></script>
</head>
<body><aside class="card" aria-label="プレビューの説明"><strong>架空データ専用・最新版の試用版</strong><p>実名・連絡先・実際の予定は入力しないでください。保存・公開はこのブラウザー内だけの模擬操作です。他の端末とは共有されず、実際の認証・GAS保存は試せません。</p><p>管理 → 本番の編集 → 架空本番サンプルから、全体を見る・当日の流れ・曲・MC・配置図を試せます。</p><nav><a href="admin.html">管理者を試す</a> ／ <a href="parent.html">保護者を試す</a> ／ <a href="teacher.html">先生を試す</a></nav></aside>
  <header><div class="shell"><p class="eyebrow">平沼マーチングバンド · 管理者</p><h1>毎月の運営</h1></div></header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite">読み込み中です…</p>
    <section id="connection" class="card" hidden>
      <h2>アプリの接続設定</h2>
      <p>管理者から案内されたGAS Web AppのURLを設定してください。管理者の招待URLから開くと接続できます。</p>
      <label>GAS Web App URL<input id="api-url" type="url" placeholder="接続不可（試用版）" autocomplete="off"></label>
      <button id="connect" type="button" class="primary">接続する</button>
    </section>
    <fieldset id="workspace" hidden>
      <legend class="sr-only">月間運営</legend>
      <div class="toolbar"><strong id="month-title"></strong><span id="save-state"></span><button id="save" class="primary" type="button">下書きを保存</button><button id="go-publish" type="button" hidden>公開へ進む</button><button class="subtle" id="reload" type="button">再読み込み</button><button class="subtle" id="forget" type="button">この端末の認証を解除</button></div>
      <nav id="tabs" aria-label="主な作業" class="tabs admin-main-tabs"></nav>
      <nav id="utility-tabs" aria-label="補助メニュー" class="utility-tabs"></nav>
      <section id="panel" aria-live="off"></section>
    </fieldset>
  </main>
</body>
</html>
