<body><aside class="card" aria-label="プレビューの説明"><strong>架空データ専用・最新版の試用版</strong><p>実名・連絡先・実際の予定は入力しないでください。保存・公開はこのブラウザー内だけの模擬操作です。他の端末とは共有されず、実際の認証・GAS保存は試せません。</p><p>管理 → 本番・曲MC取込 → 架空本番サンプルから、全体を見る・当日の流れ・曲・MC・配置図を試せます。</p><nav><a href="admin.html">管理者を試す</a> ／ <a href="parent.html">保護者を試す</a> ／ <a href="teacher.html">先生を試す</a></nav></aside>
