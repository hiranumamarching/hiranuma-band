<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>先生用・候補日入力｜平沼マーチングバンド</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="teacher-preview.css">
  <script src="preview-api.js" defer></script>
  <script src="teacher.js" defer></script>
</head>
<body><aside class="card" aria-label="プレビューの説明"><strong>架空データ専用・操作確認プレビュー</strong><p>保存はこのブラウザーだけ。実名・連絡先は入力しないでください。「公開」もこの端末内の模擬操作です。実際の共有保存・認証は検証できません。</p><nav><a href="admin.html">管理者</a> ／ <a href="parent.html">保護者</a> ／ <a href="teacher.html">先生</a></nav><button type="button" id="preview-reset">架空データを初期状態に戻す</button></aside>
  <header><div class="shell"><p class="eyebrow">平沼マーチングバンド · 先生用</p><h1>候補日の可否入力</h1></div></header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite">読み込み中です…</p>
    <section id="connection" class="card" hidden>
      <h2>アプリの接続設定</h2>
      <p>管理者から案内された先生用URLで開いてください。初回のみGAS Web AppのURLを設定します。</p>
      <label>GAS Web App URL<input id="api-url" type="url" placeholder="接続不可（プレビュー）" autocomplete="off"></label>
      <button id="connect" type="button" class="primary">接続する</button>
    </section>
    <fieldset id="workspace" hidden>
      <legend class="sr-only">先生用候補日入力</legend>
      <section class="card teacher-card">
        <div class="teacher-identity"><p class="muted">入力する先生</p><h2 id="teacher-name"></h2></div>
        <p class="muted">○／×を選択。選択中をもう一度押すと未入力に戻ります。</p>
      </section>
      <section class="card teacher-month">
        <h2>対象月</h2>
        <div id="months" class="pills month-pills" role="group" aria-label="対象月"></div>
      </section>
      <section id="sessions" aria-live="polite"></section>
      <div class="save-bar"><p id="save-state" class="muted">変更はありません。</p><button id="save" type="button" class="primary">送信</button></div>
    </fieldset>
  </main>
</body>
</html>
