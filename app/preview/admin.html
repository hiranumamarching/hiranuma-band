<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>運営管理｜平沼マーチングバンド</title>
  <link rel="stylesheet" href="common.css?v=668325c3">
  <script src="preview-api.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="practice-plan.js" defer></script>
  <script src="layout-mobile.js" defer></script>
  <script src="admin.js?v=e435c964" defer></script>
</head>
<body><aside class="card" aria-label="プレビューの説明"><strong>架空データ専用・操作確認プレビュー</strong><p>保存はこのブラウザーだけ。実名・連絡先は入力しないでください。「公開」もこの端末内の模擬操作です。実際の共有保存・認証は検証できません。</p><nav><a href="admin.html">管理者</a> ／ <a href="parent.html">保護者</a> ／ <a href="teacher.html">先生</a></nav><button type="button" id="preview-reset">架空データを初期状態に戻す</button></aside>
  <header><div class="shell"><p class="eyebrow">平沼マーチングバンド · 管理者</p><h1>毎月の運営</h1></div></header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite">読み込み中です…</p>
    <section id="connection" class="card" hidden>
      <h2>アプリの接続設定</h2>
      <p>管理者から案内されたGAS Web AppのURLを設定してください。管理者の招待URLから開くと接続できます。</p>
      <label>GAS Web App URL<input id="api-url" type="url" placeholder="接続不可（プレビュー）" autocomplete="off"></label>
      <button id="connect" type="button" class="primary">接続する</button>
    </section>
    <fieldset id="workspace" hidden>
      <legend class="sr-only">月間運営</legend>
      <div class="toolbar"><strong id="month-title"></strong><span id="save-state"></span><button id="save" class="primary" type="button">下書きを保存</button><button id="go-publish" type="button" hidden>公開へ進む</button><button class="subtle" id="reload" type="button">再読み込み</button><button class="subtle" id="forget" type="button">この端末の認証を解除</button></div>
      <nav id="tabs" aria-label="主な作業" class="tabs admin-main-tabs"></nav>
      <nav id="utility-tabs" aria-label="補助メニュー" class="utility-tabs"></nav>
      <section id="panel" aria-live="off"></section>
    </fieldset>
  </main>
</body>
</html>
